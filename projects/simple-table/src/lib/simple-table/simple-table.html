<div
  class="didi-table-wrap"
  [class.didi-has-sticky]="stickyHeader && !isStacked"
  (copy)="onCopy($event)"
>
  <div *ngIf="searchable || columnCollapse || exportable" class="didi-table-toolbar">
    <label *ngIf="searchable" class="didi-table-search">
      <span class="didi-sr-only">{{ searchPlaceholderText }}</span>
      <input
        type="search"
        [placeholder]="searchPlaceholderText"
        [value]="searchBox"
        [disabled]="loading && isEmpty"
        (input)="onSearchInput($event)"
        (keydown)="onSearchKeydown($event)"
      />
    </label>
    <div class="didi-toolbar-actions">
      <button
        *ngIf="exportable"
        type="button"
        class="didi-export-button"
        (click)="exportCsv()"
      >
        {{ resolvedLabels.exportCsv }}
      </button>
      <div *ngIf="columnCollapse" class="didi-column-menu">
        <button
          type="button"
          class="didi-column-menu-toggle"
          [attr.aria-expanded]="columnMenuOpen"
          aria-haspopup="true"
          (click)="toggleColumnMenu(); $event.stopPropagation()"
        >
          {{ columnMenuLabel }}
        </button>
        <button
          *ngIf="canShowAllColumns"
          type="button"
          class="didi-column-reset"
          (click)="showAllColumns(); $event.stopPropagation()"
        >
          {{ resolvedLabels.showAllColumns }}
        </button>
        <div
          *ngIf="columnMenuOpen"
          class="didi-column-menu-panel"
          role="group"
          [attr.aria-label]="resolvedLabels.visibleColumns"
        >
          <label *ngFor="let column of columns; trackBy: trackByColumn" class="didi-column-menu-item">
            <input
              type="checkbox"
              [checked]="!isCollapsed(column)"
              [disabled]="!canToggleColumn(column)"
              (change)="toggleColumnHidden(column, $event)"
            />
            <span>{{ column.label }}</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div
    #scrollArea
    class="didi-table-container"
    [class.didi-has-sticky]="stickyHeader && !isStacked"
    [style.max-height]="isStacked ? null : maxHeight"
    (scroll)="onScroll()"
  >
    <div *ngIf="showLoadingOverlay" class="didi-table-overlay" role="status" aria-live="polite">
      <ng-container *ngIf="loadingTemplate; else defaultOverlay">
        <ng-container *ngTemplateOutlet="loadingTemplate"></ng-container>
      </ng-container>
      <ng-template #defaultOverlay>{{ loadingText }}</ng-template>
    </div>

    <table
      role="grid"
      [attr.aria-busy]="loading ? true : null"
      [attr.aria-rowcount]="ariaRowCount"
      [attr.aria-colcount]="columnCount"
    >
      <caption *ngIf="caption" class="didi-sr-only">{{ caption }}</caption>
      <thead>
        <tr>
          <th
            *ngIf="expandable"
            class="didi-expand-cell"
            scope="col"
            [class.didi-is-pinned]="isChromePinned"
            [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('expand') : null"
          ></th>
          <th
            *ngIf="isMultiple"
            class="didi-select-cell"
            scope="col"
            [class.didi-is-pinned]="isChromePinned"
            [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('select') : null"
          >
            <input
              type="checkbox"
              [checked]="allVisibleSelected"
              [indeterminate]="someVisibleSelected"
              [disabled]="loading || isEmpty"
              [attr.aria-label]="selectAllLabel"
              (change)="toggleAllVisible($event)"
            />
          </th>
          <th
            *ngFor="let column of visibleColumns; trackBy: trackByColumn"
            scope="col"
            [attr.data-column-key]="column.key"
            [attr.aria-sort]="ariaSort(column)"
            [class.didi-is-pinned]="isPinned(column)"
            [class.didi-is-pinned-end]="isPinnedEnd(column)"
            [class.didi-is-pin-edge]="isPinEdge(column)"
            [class.didi-is-pin-edge-end]="isPinEndEdge(column)"
            [ngStyle]="columnStyle(column, true)"
            [draggable]="columnReorder"
            (dragstart)="onHeaderDragStart(column, $event)"
            (dragover)="onHeaderDragOver($event)"
            (drop)="onHeaderDrop(column, $event)"
          >
            <div class="didi-th-inner">
              <button
                *ngIf="isSortable(column); else staticHeader"
                type="button"
                class="didi-sort-button"
                [disabled]="loading && isEmpty"
                [attr.aria-label]="sortButtonLabel(column)"
                (click)="toggleSort(column)"
              >
                <ng-container *ngIf="getHeaderTemplate(column) as headerTemplate; else defaultSortLabel">
                  <ng-container *ngTemplateOutlet="headerTemplate; context: headerContext(column)"></ng-container>
                </ng-container>
                <ng-template #defaultSortLabel>
                  <span>{{ column.label }}</span>
                </ng-template>
                <span class="didi-sort-icon" [class.didi-is-active]="sortIndex(column) >= 0" aria-hidden="true">{{
                  sortIcon(column)
                }}</span>
              </button>
              <ng-template #staticHeader>
                <ng-container *ngIf="getHeaderTemplate(column) as headerTemplate; else defaultHeader">
                  <ng-container *ngTemplateOutlet="headerTemplate; context: headerContext(column)"></ng-container>
                </ng-container>
                <ng-template #defaultHeader>
                  <span class="didi-th-label">{{ column.label }}</span>
                </ng-template>
              </ng-template>
              <button
                *ngIf="canHideColumn(column)"
                type="button"
                class="didi-collapse-button"
                [attr.aria-label]="hideColumnLabel(column)"
                (click)="hideColumn(column, $event)"
              >
                ×
              </button>
              <span
                *ngIf="columnResize"
                class="didi-resize-handle"
                (mousedown)="onResizeStart(column, $event)"
              ></span>
            </div>
          </th>
        </tr>
        <tr *ngIf="hasFilterRow" class="didi-filter-row">
          <th
            *ngIf="expandable"
            [class.didi-is-pinned]="isChromePinned"
            [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('expand') : null"
          ></th>
          <th
            *ngIf="isMultiple"
            [class.didi-is-pinned]="isChromePinned"
            [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('select') : null"
          ></th>
          <th
            *ngFor="let column of visibleColumns; trackBy: trackByColumn"
            [class.didi-is-pinned]="isPinned(column)"
            [class.didi-is-pinned-end]="isPinnedEnd(column)"
            [class.didi-is-pin-edge]="isPinEdge(column)"
            [class.didi-is-pin-edge-end]="isPinEndEdge(column)"
            [ngStyle]="columnStyle(column, true)"
          >
            <ng-container *ngIf="column.filter">
              <select
                *ngIf="filterKind(column) === 'select'; else textFilter"
                class="didi-filter-control"
                [value]="filterValue(column)"
                (change)="onFilterInput(column, $event)"
              >
                <option value=""></option>
                <option *ngFor="let option of column.filterOptions" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
              <ng-template #textFilter>
                <input
                  class="didi-filter-control"
                  [type]="filterKind(column) === 'number' ? 'text' : filterKind(column) === 'date' ? 'date' : 'search'"
                  [value]="filterValue(column)"
                  (input)="onFilterInput(column, $event)"
                />
              </ng-template>
            </ng-container>
          </th>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="virtualPadTop" class="didi-virtual-pad" aria-hidden="true">
          <td [attr.colspan]="columnCount" [style.height.px]="virtualPadTop"></td>
        </tr>

        <tr *ngIf="showLoadingRow" class="didi-status-row">
          <td class="didi-status-cell" [attr.colspan]="columnCount" role="status" aria-live="polite">
            <ng-container *ngIf="loadingTemplate; else defaultLoading">
              <ng-container *ngTemplateOutlet="loadingTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultLoading>{{ loadingText }}</ng-template>
          </td>
        </tr>

        <tr *ngIf="showEmptyRow" class="didi-status-row">
          <td class="didi-status-cell" [attr.colspan]="columnCount" role="status" aria-live="polite">
            <ng-container *ngIf="emptyTemplate; else defaultEmpty">
              <ng-container *ngTemplateOutlet="emptyTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultEmpty>{{ emptyText }}</ng-template>
          </td>
        </tr>

        <ng-container *ngIf="showRows">
          <ng-container *ngFor="let item of viewItems; trackBy: trackByRow">
            <tr *ngIf="asGroup(item) as group" class="didi-group-row">
              <td [attr.colspan]="columnCount">{{ group.value }} ({{ group.count }})</td>
            </tr>
            <ng-container *ngIf="asData(item) as rowItem">
            <tr
              class="didi-data-row"
              [class.didi-is-clickable]="isClickable"
              [class.didi-is-selected]="isSelected(rowItem.row)"
              [class.didi-is-active]="rowItem.index === activeRowIndex"
              [ngClass]="rowClasses(rowItem.row)"
              [attr.aria-selected]="isSelectable ? isSelected(rowItem.row) : null"
              [attr.aria-expanded]="expandable ? isExpanded(rowItem.row) : null"
              [attr.tabindex]="rowTabIndex(rowItem.index)"
              (click)="onRowClick(rowItem.row, rowItem.index, $event)"
              (keydown)="onRowKeydown(rowItem.row, rowItem.index, $event)"
            >
              <td
                *ngIf="expandable"
                class="didi-expand-cell"
                [class.didi-is-pinned]="isChromePinned"
                [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('expand') : null"
                (click)="$event.stopPropagation()"
              >
                <button
                  type="button"
                  class="didi-expand-button"
                  [attr.aria-label]="isExpanded(rowItem.row) ? resolvedLabels.collapseRow : resolvedLabels.expandRow"
                  (click)="toggleExpanded(rowItem.row, $event)"
                >
                  {{ isExpanded(rowItem.row) ? '▾' : '▸' }}
                </button>
              </td>
              <td
                *ngIf="isMultiple"
                class="didi-select-cell"
                [class.didi-is-pinned]="isChromePinned"
                [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('select') : null"
                (click)="$event.stopPropagation()"
              >
                <input
                  type="checkbox"
                  [checked]="isSelected(rowItem.row)"
                  [attr.aria-label]="resolvedLabels.selectRow"
                  (change)="onCheckboxChange(rowItem.row, $event)"
                />
              </td>
              <td
                *ngFor="let column of visibleColumns; trackBy: trackByColumn"
                [attr.data-label]="column.label"
                [class.didi-is-pinned]="isPinned(column)"
                [class.didi-is-pinned-end]="isPinnedEnd(column)"
                [class.didi-is-pin-edge]="isPinEdge(column)"
                [class.didi-is-pin-edge-end]="isPinEndEdge(column)"
                [ngStyle]="columnStyle(column)"
                [ngClass]="cellClasses(rowItem.row, column)"
                (dblclick)="startEdit(rowItem.row, column, $event)"
              >
                <span *ngIf="isStacked" class="didi-stack-label">
                  <ng-container *ngIf="getHeaderTemplate(column) as headerTemplate; else defaultStackLabel">
                    <ng-container *ngTemplateOutlet="headerTemplate; context: headerContext(column)"></ng-container>
                  </ng-container>
                  <ng-template #defaultStackLabel>{{ column.label }}</ng-template>
                </span>
                <span class="didi-stack-value">
                  <input
                    *ngIf="isEditing(rowItem.row, column); else cellDisplay"
                    class="didi-edit-input"
                    [value]="editing?.value"
                    (input)="onEditInput($event)"
                    (blur)="commitEdit()"
                    (keydown.enter)="commitEdit()"
                    (keydown.escape)="cancelEdit()"
                  />
                  <ng-template #cellDisplay>
                    <ng-container *ngIf="getCellTemplate(column) as cellTemplate; else defaultCell">
                      <ng-container
                        *ngTemplateOutlet="cellTemplate; context: cellContext(rowItem.row, column)"
                      ></ng-container>
                    </ng-container>
                    <ng-template #defaultCell>{{ getCellValue(rowItem.row, column) }}</ng-template>
                  </ng-template>
                </span>
              </td>
            </tr>
            <tr *ngIf="expandable && isExpanded(rowItem.row)" class="didi-detail-row">
              <td [attr.colspan]="columnCount">
                <ng-container *ngIf="detailTemplate">
                  <ng-container *ngTemplateOutlet="detailTemplate; context: detailContext(rowItem.row)"></ng-container>
                </ng-container>
              </td>
            </tr>
            </ng-container>
          </ng-container>
        </ng-container>

        <tr *ngIf="virtualPadBottom" class="didi-virtual-pad" aria-hidden="true">
          <td [attr.colspan]="columnCount" [style.height.px]="virtualPadBottom"></td>
        </tr>
      </tbody>

      <tfoot *ngIf="hasFooter && !isEmpty && !isStacked">
        <tr>
          <td
            *ngIf="expandable"
            [class.didi-is-pinned]="isChromePinned"
            [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('expand') : null"
          ></td>
          <td
            *ngIf="isMultiple"
            [class.didi-is-pinned]="isChromePinned"
            [style.inset-inline-start.px]="isChromePinned ? chromePinOffset('select') : null"
          ></td>
          <td
            *ngFor="let column of visibleColumns; trackBy: trackByColumn"
            [class.didi-is-pinned]="isPinned(column)"
            [class.didi-is-pinned-end]="isPinnedEnd(column)"
            [class.didi-is-pin-edge]="isPinEdge(column)"
            [class.didi-is-pin-edge-end]="isPinEndEdge(column)"
            [ngStyle]="columnStyle(column)"
          >
            <ng-container *ngIf="getFooterTemplate(column) as footerTemplate; else defaultFooter">
              <ng-container *ngTemplateOutlet="footerTemplate; context: footerContext(column)"></ng-container>
            </ng-container>
            <ng-template #defaultFooter>{{ getFooterValue(column) }}</ng-template>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>

  <nav
    *ngIf="isPaginated && !isEmpty"
    class="didi-pager"
    [attr.aria-label]="resolvedLabels.pagination"
  >
    <div class="didi-pager-meta">
      <p class="didi-pager-status" aria-live="polite">{{ rangeLabel }}</p>
      <label *ngIf="resolvedPageSizeOptions.length" class="didi-pager-size">
        <span>{{ resolvedLabels.rows }}</span>
        <select
          [value]="pageSize"
          [disabled]="loading && isEmpty"
          [attr.aria-label]="resolvedLabels.rowsPerPage"
          (change)="onPageSizeSelect($event)"
        >
          <option *ngFor="let size of resolvedPageSizeOptions" [value]="size">{{ size }}</option>
        </select>
      </label>
    </div>
    <div class="didi-pager-actions">
      <button
        type="button"
        class="didi-pager-first"
        [disabled]="currentPage <= 1"
        [attr.aria-label]="resolvedLabels.firstPage"
        (click)="goToPage(1)"
      >
        {{ pagerButtonText('first') }}
      </button>
      <button
        type="button"
        class="didi-pager-prev"
        [disabled]="currentPage <= 1"
        [attr.aria-label]="resolvedLabels.previous"
        (click)="goToPage(currentPage - 1)"
      >
        {{ pagerButtonText('prev') }}
      </button>
      <span class="didi-pager-page">{{ pageLabel }}</span>
      <button
        type="button"
        class="didi-pager-next"
        [disabled]="currentPage >= totalPages"
        [attr.aria-label]="resolvedLabels.next"
        (click)="goToPage(currentPage + 1)"
      >
        {{ pagerButtonText('next') }}
      </button>
      <button
        type="button"
        class="didi-pager-last"
        [disabled]="currentPage >= totalPages"
        [attr.aria-label]="resolvedLabels.lastPage"
        (click)="goToPage(totalPages)"
      >
        {{ pagerButtonText('last') }}
      </button>
    </div>
  </nav>
</div>

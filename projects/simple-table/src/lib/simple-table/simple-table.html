<div
  class="table-wrap"
  [class.has-sticky]="stickyHeader && !isStacked"
>
  <div *ngIf="searchable || columnCollapse" class="table-toolbar">
    <label *ngIf="searchable" class="table-search">
      <span class="sr-only">{{ searchPlaceholder }}</span>
      <input
        type="search"
        [placeholder]="searchPlaceholder"
        [value]="search"
        [disabled]="loading"
        (input)="onSearchInput($event)"
      />
    </label>
    <div *ngIf="columnCollapse" class="column-menu">
      <button
        type="button"
        class="column-menu-toggle"
        [attr.aria-expanded]="columnMenuOpen"
        aria-haspopup="true"
        (click)="toggleColumnMenu(); $event.stopPropagation()"
      >
        {{ columnMenuLabel }}
      </button>
      <div *ngIf="columnMenuOpen" class="column-menu-panel" role="group" aria-label="Visible columns">
        <label *ngFor="let column of columns" class="column-menu-item">
          <input
            type="checkbox"
            [checked]="!isCollapsed(column)"
            [disabled]="!canToggleColumn(column)"
            (change)="toggleColumnHidden(column, $event)"
          />
          <span>{{ column.label }}</span>
        </label>
      </div>
    </div>
  </div>

  <div
    class="table-container"
    [class.has-sticky]="stickyHeader && !isStacked"
    [style.max-height]="isStacked ? null : maxHeight"
  >
    <table
      [attr.aria-busy]="loading ? true : null"
      [attr.aria-rowcount]="ariaRowCount"
      [attr.aria-colcount]="columnCount"
    >
      <caption *ngIf="caption" class="sr-only">{{ caption }}</caption>
      <thead>
        <tr>
          <th *ngIf="isMultiple" class="select-cell" scope="col">
            <input
              type="checkbox"
              [checked]="allVisibleSelected"
              [indeterminate]="someVisibleSelected"
              [disabled]="loading || isEmpty"
              aria-label="Select all rows on this page"
              (change)="toggleAllVisible($event)"
            />
          </th>
          <th *ngFor="let column of visibleColumns" scope="col" [attr.aria-sort]="ariaSort(column)">
            <div class="th-inner">
              <button
                *ngIf="isSortable(column); else staticHeader"
                type="button"
                class="sort-button"
                [disabled]="loading"
                [attr.aria-label]="sortButtonLabel(column)"
                (click)="toggleSort(column)"
              >
                <ng-container *ngIf="getHeaderTemplate(column) as headerTemplate; else defaultSortLabel">
                  <ng-container *ngTemplateOutlet="headerTemplate; context: headerContext(column)"></ng-container>
                </ng-container>
                <ng-template #defaultSortLabel>
                  <span>{{ column.label }}</span>
                </ng-template>
                <span class="sort-icon" [class.is-active]="sortIndex(column) >= 0" aria-hidden="true">{{
                  sortIcon(column)
                }}</span>
              </button>
              <ng-template #staticHeader>
                <ng-container *ngIf="getHeaderTemplate(column) as headerTemplate; else defaultHeader">
                  <ng-container *ngTemplateOutlet="headerTemplate; context: headerContext(column)"></ng-container>
                </ng-container>
                <ng-template #defaultHeader>
                  <span class="th-label">{{ column.label }}</span>
                </ng-template>
              </ng-template>
              <button
                *ngIf="canHideColumn(column)"
                type="button"
                class="collapse-button"
                [attr.aria-label]="'Hide ' + column.label + ' column'"
                (click)="hideColumn(column, $event)"
              >
                ×
              </button>
            </div>
          </th>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="loading" class="status-row">
          <td class="status-cell" [attr.colspan]="columnCount" role="status" aria-live="polite">
            <ng-container *ngIf="loadingTemplate; else defaultLoading">
              <ng-container *ngTemplateOutlet="loadingTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultLoading>{{ loadingMessage }}</ng-template>
          </td>
        </tr>

        <tr *ngIf="!loading && isEmpty" class="status-row">
          <td class="status-cell" [attr.colspan]="columnCount" role="status" aria-live="polite">
            <ng-container *ngIf="emptyTemplate; else defaultEmpty">
              <ng-container *ngTemplateOutlet="emptyTemplate"></ng-container>
            </ng-container>
            <ng-template #defaultEmpty>{{ emptyMessage }}</ng-template>
          </td>
        </tr>

        <ng-container *ngIf="!loading && !isEmpty">
          <tr
            *ngFor="let row of displayData"
            [class.is-clickable]="isClickable"
            [class.is-selected]="isSelected(row)"
            [attr.aria-selected]="isSelectable ? isSelected(row) : null"
            [attr.tabindex]="isClickable ? 0 : null"
            (click)="onRowClick(row, $event)"
            (keydown)="onRowKeydown(row, $event)"
          >
            <td *ngIf="isMultiple" class="select-cell" (click)="$event.stopPropagation()">
              <input
                type="checkbox"
                [checked]="isSelected(row)"
                aria-label="Select row"
                (change)="onCheckboxChange(row, $event)"
              />
            </td>
            <td *ngFor="let column of visibleColumns" [attr.data-label]="column.label">
              <ng-container *ngIf="getCellTemplate(column) as cellTemplate; else defaultCell">
                <ng-container *ngTemplateOutlet="cellTemplate; context: cellContext(row, column)"></ng-container>
              </ng-container>
              <ng-template #defaultCell>{{ getCellValue(row, column) }}</ng-template>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>

  <nav *ngIf="isPaginated && !loading && !isEmpty" class="didi-pager" aria-label="Table pagination">
    <div class="didi-pager-meta">
      <p class="didi-pager-status" aria-live="polite">{{ rangeStart }}–{{ rangeEnd }} of {{ itemCount }}</p>
      <label *ngIf="resolvedPageSizeOptions.length" class="didi-pager-size">
        <span>Rows</span>
        <select
          [value]="pageSize"
          [disabled]="loading"
          aria-label="Rows per page"
          (change)="onPageSizeSelect($event)"
        >
          <option *ngFor="let size of resolvedPageSizeOptions" [value]="size">{{ size }}</option>
        </select>
      </label>
    </div>
    <div class="didi-pager-actions">
      <button
        type="button"
        class="didi-pager-prev"
        [disabled]="currentPage <= 1"
        aria-label="Previous page"
        (click)="goToPage(currentPage - 1)"
      >
        Previous
      </button>
      <span class="didi-pager-page">Page {{ currentPage }} of {{ totalPages }}</span>
      <button
        type="button"
        class="didi-pager-next"
        [disabled]="currentPage >= totalPages"
        aria-label="Next page"
        (click)="goToPage(currentPage + 1)"
      >
        Next
      </button>
    </div>
  </nav>
</div>
